name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # The Python suite on all three platforms. QGIS is not needed: the tests
  # import platform_utils and friends outside a QGIS session.
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest numpy
      - run: python -m pytest tests -m "not slow" -q

  # Builds the routing engine plus the bundled TauDEM tools (pitremove,
  # dinfflowdir, areadinf, threshold, dinfdistdown, dinfdistup) with MSVC, bundles their DLLs and proj.db, and runs them under
  # MS-MPI. The result is bin/windows_amd64/, uploaded as an artifact.
  windows-native:
    name: Windows engine + TauDEM
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      SRC: ml_dfi_handoff/steps/step4_deposition_zone/cpp_mpi_port
      OUT: bin/windows_amd64
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # MS-MPI runtime (mpiexec) + SDK (headers, msmpi.lib for CMake's FindMPI).
      - uses: mpi4py/setup-mpi@v1
        with:
          mpi: msmpi

      # Puts whichever MSVC the runner image has on PATH. Paired with Ninja
      # below, nothing names a Visual Studio version, so image upgrades
      # (VS 2022 -> 2026) do not break the build.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Prebuilt GDAL/PROJ from conda-forge, plus GDAL's Python bindings for
      # the smoke test, pefile for the DLL bundler, and the build tools.
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: build
          init-shell: powershell
          create-args: >-
            python=3.12 libgdal-core gdal numpy pefile cmake ninja

      - name: Build
        run: |
          cmake -S $env:SRC -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl `
            -DMLPREP_BUILD_TAUDEM_TOOLS=ON `
            -DCMAKE_PREFIX_PATH="$env:CONDA_PREFIX\Library"
          cmake --build build --parallel

      - name: Bundle DLLs and proj.db
        run: |
          New-Item -ItemType Directory -Force $env:OUT | Out-Null
          foreach ($exe in "step4_deposition_zone_mpi", "pitremove", "dinfflowdir",
                           "areadinf", "threshold", "dinfdistdown", "dinfdistup") {
            Copy-Item "build/$exe.exe" $env:OUT
          }
          python scripts/bundle_windows_deps.py `
            --search-dir "$env:CONDA_PREFIX\Library\bin" `
            --proj-dir "$env:CONDA_PREFIX\Library\share\proj" `
            --out $env:OUT `
            (Get-ChildItem "$env:OUT\*.exe").FullName

      # Runs the tools exactly as the deposition worker does, with PATH and
      # PROJ_DATA stripped so a gap in the bundle fails here.
      - name: Smoke test
        run: python scripts/taudem_smoke_test.py

      - uses: actions/upload-artifact@v4
        with:
          name: bin-windows_amd64
          path: bin/windows_amd64
          if-no-files-found: error
